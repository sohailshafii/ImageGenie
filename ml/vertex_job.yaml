# Vertex AI custom-job spec for a training run (`make train-cloud`).
#
# A YAML spec rather than a pile of --worker-pool-spec flags, because two of the
# settings that matter most here have no convenient flag form: the SPOT strategy
# and the container env.
#
# Substituted by the Makefile: __IMAGE__, __SERVICE_ACCOUNT__, __INSTANCE__,
# __SECRET__, __ARGS__.
workerPoolSpecs:
  - machineSpec:
      # n1-standard-8 is the smallest shape a T4 attaches to. T4 is the cheapest
      # widely-available spot GPU and ample for a resnet18-backed multi-view CNN
      # (server.md#training-gpu).
      machineType: n1-standard-8
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: __IMAGE__
      args: __ARGS__
      env:
        # Reaching Cloud SQL: Vertex has no Unix socket to mount and its egress
        # IP is dynamic, so the job dials through the Cloud SQL connector over
        # IAM (server.md#training-gpu).
        - name: IMAGEGENIE_CLOUDSQL_INSTANCE
          value: __INSTANCE__
        # The URL is fetched at startup rather than set here: everything in this
        # env block is visible in the job's metadata, and the URL carries the
        # database password.
        - name: IMAGEGENIE_DATABASE_URL_SECRET
          value: __SECRET__

# SPOT or STANDARD, substituted by `make train-cloud` (SPOT=0 for on-demand).
#
# Spot is the default because it is what keeps the training line inside NFR-1's
# $5–20 — but it suits SHORT runs only. A preemption does not pause a run, it
# restarts it: Vertex retries the job, train.py starts from epoch 1 and writes a
# *new* training_run row, while the killed one lingers as `running` because
# SIGKILL never reaches its finalizer. A 6-epoch full-set run learned this the
# expensive way — nine restarts, three hours of GPU time, no progress past epoch
# 1, and the job state never left RUNNING so nothing looked wrong.
#
# Rule of thumb: spot for anything under ~30 minutes, STANDARD for a run that has
# to hold a node for hours. On-demand is ~$0.73/hr against spot's ~$0.20, so a
# 6-hour run costs about $4.40 — still well inside the budget, and it finishes.
scheduling:
  strategy: __STRATEGY__
  # A hard ceiling on wall-clock: Vertex kills the job at this point whatever it
  # is doing. The budget alerts (infra/budget.tf) only *notify*, and they notify
  # against a $100 monthly total — far too coarse and too late to stop a training
  # job that is not progressing. This is the mechanism that actually bounds the
  # spend of one run. Default 6h via MAX_HOURS, comfortably above the ~3.8h a
  # 4-epoch full-set run needs at the measured 0.288 s/model/epoch.
  timeout: __TIMEOUT__

serviceAccount: __SERVICE_ACCOUNT__
